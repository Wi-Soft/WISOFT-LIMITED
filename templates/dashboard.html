<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Dashboard</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Dashboard Overview</h2>
        <span class="text-muted">Welcome, {{ request.user.username }}</span>
    </div>

    <!-- Dashboard Tiles Grid -->
    <div class="row g-4">
        {% for tile in tiles %}
        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <p class="text-muted text-uppercase small fw-semibold mb-1">
                        {{ tile.title }}
                    </p>
                    <h3 class="fw-bold mb-2">{{ tile.value }}</h3>
                    <span class="badge bg-{{ tile.badge_color }} bg-opacity-10 text-{{ tile.badge_color }}">
                        {{ tile.subtitle }}
                    </span>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

</body>
</html>
