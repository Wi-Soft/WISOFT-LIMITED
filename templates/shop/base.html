<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TileHouse{% endblock %}</title>
    <style>
        *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f7f8fa;color:#202938}
        a{text-decoration:none;color:inherit} header{display:flex;justify-content:space-between;align-items:center;padding:18px 7%;background:white;box-shadow:0 2px 10px #00000010}
        .logo{font-size:24px;font-weight:800}.logo span{color:#e49c46}.nav{display:flex;gap:18px;align-items:center}.nav a{font-weight:600}.cart{background:#263e5c;color:white!important;padding:10px 16px;border-radius:6px}
        main{min-height:65vh}.container{max-width:1250px;margin:auto;padding:40px 20px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.card{background:white;border-radius:8px;overflow:hidden;box-shadow:0 5px 20px #0000000d}.card img{width:100%;height:190px;object-fit:cover}.card-body{padding:16px}.price{color:#d68b36;font-size:18px;font-weight:800}.btn{display:inline-block;border:0;background:#263e5c;color:white;padding:10px 16px;border-radius:5px;cursor:pointer}.btn:hover{background:#d68b36}.search{display:flex;gap:10px;margin:20px 0}.search input{flex:1;padding:12px}.messages{max-width:1250px;margin:15px auto}.message{padding:12px;background:#e7f8ee;color:#237b4c;border-radius:5px}.message.error{background:#ffeded;color:#bb3333}.footer{background:#172b42;color:white;text-align:center;padding:28px;margin-top:40px}
        @media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){header{flex-wrap:wrap;gap:12px}.grid{grid-template-columns:1fr}.nav{flex-wrap:wrap}}
    </style>
</head>
<body>
<header><a class="logo" href="{% url 'tile_shop' %}">TILE<span>HOUSE.</span></a><nav class="nav"><a href="{% url 'tile_shop' %}">Shop</a><a href="{% url 'tile_cart' %}" class="cart">Cart ({{ cart_count|default:0 }})</a></nav></header>
{% if messages %}<div class="messages">{% for message in messages %}<div class="message {% if message.tags == 'error' %}error{% endif %}">{{ message }}</div>{% endfor %}</div>{% endif %}
<main>{% block content %}{% endblock %}</main>
<footer class="footer"><strong>TILEHOUSE.</strong><p>Quality Tiles for Beautiful Spaces.</p><p>&copy; {% now "Y" %} TileHouse.</p></footer>
</body>
</html>
